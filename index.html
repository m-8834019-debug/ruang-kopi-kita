button,input,select{font:inherit}

header{

.hero p{

}
.hero button,.add,.checkout{

  color:white;

.hero button{margin-top:20px}
.hero button:hover,.add:hover,.checkout:hover{

.container{

.photo-wrap{

/*

 Nota:

/*
 MENU YANG DISEDIAKAN UNTUK GAMBAR AI.

 Contoh fail:
 images/ruang-kopi-kita-signature.jpg

 Fail tersebut perlu dimuat naik ke GitHub.
 Jika belum wujud, foto rujukan akan digunakan.

const aiImageNames=new Set([
  "Ruang Kopi Kita Signature",
  "Sukiya Maggie Bowl",
  "Sukiya Rice Bowl",
  "Cili Padi Beef Bowl",
  "Sukiya Beef Bowl (150g)",
  "Creamy Tomyam",
  "Gigi Hadid",
  "Matcha Biscoff",
  "Matcha Taro",
  "Black Forest",
  "Chocolate Pistachio",
  "Mango Unite",
  "PineApple Pine",
  "Blue Lagoon"
]);

function slug(name){
  return name.toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

function stockPhoto(item){
  const list=photos[item.category]||photos.coffee;
  const index=menu
    .filter(x=>x.category===item.category)
    .findIndex(x=>x.id===item.id);

  const photo=list[index%list.length];

  return "https://images.unsplash.com/"+
    photo+
    "?auto=format&fit=crop&w=700&q=85";
}

function imageFor(item){
  if(aiImageNames.has(item.name)){
    return "images/"+slug(item.name)+".jpg";
  }
  return stockPhoto(item);
}

let selectedCategory="all";
let cart=[];
let submitting=false;

const $=id=>document.getElementById(id);
const money=n=>"RM"+Number(n).toFixed(2);

/* CATEGORY */

function renderCategories(){
  const root=$("categories");
  root.replaceChildren();

  Object.entries(categories).forEach(([key,label])=>{
    const btn=document.createElement("button");
    btn.className="category-btn"+
      (selectedCategory===key?" active":"");
    btn.textContent=label;

    btn.onclick=()=>{
      selectedCategory=key;
      renderCategories();
      renderMenu();
    };

    root.appendChild(btn);
  });
}

/* MENU CARDS */

function renderMenu(){
  const root=$("menuGrid");
  root.replaceChildren();

  const query=$("searchInput").value
    .toLowerCase().trim();

  const filtered=menu.filter(item=>
    (selectedCategory==="all"||
     item.category===selectedCategory) &&
    item.name.toLowerCase().includes(query)
  );

  if(!filtered.length){
    const p=document.createElement("p");
    p.textContent="Tiada menu ditemui.";
    root.appendChild(p);
    return;
  }

  filtered.forEach(item=>{
    const card=document.createElement("article");
    card.className="menu-card";

    const photoWrap=document.createElement("div");
    photoWrap.className="photo-wrap";

    const img=document.createElement("img");
    img.className="menu-picture";
    img.src=imageFor(item);
    img.alt="Gambar rujukan "+item.name;
    img.loading="lazy";

    const photoLabel=document.createElement("span");
    photoLabel.className="photo-label";
    photoLabel.textContent="PHOTO REFERENCE";

    img.addEventListener("load",()=>{
      if(img.src.includes("/images/")){
        photoLabel.textContent="AI FOOD VISUAL";
      }
    });

    img.addEventListener("error",()=>{
      const fallback=stockPhoto(item);

      if(img.src!==fallback){
        img.src=fallback;
        photoLabel.textContent="PHOTO REFERENCE";
      }else{
        img.onerror=null;
        img.style.display="none";
        photoLabel.textContent="IMAGE UNAVAILABLE";
      }
    });

    photoWrap.append(img,photoLabel);

    const body=document.createElement("div");
    body.className="menu-body";

    const cat=document.createElement("div");
    cat.className="menu-category";
    cat.textContent=categories[item.category];

    const name=document.createElement("h3");
    name.textContent=item.name;

    const select=document.createElement("select");
    select.setAttribute(
      "aria-label","Pilihan "+item.name
    );

    Object.entries(item.prices).forEach(
      ([variant,price])=>{
        const opt=document.createElement("option");
        opt.value=variant;
        opt.textContent=variant+" — "+money(price);
        select.appendChild(opt);
      }
    );

    const bottom=document.createElement("div");
    bottom.className="menu-bottom";

    const price=document.createElement("span");
    price.className="price";

    const updatePrice=()=>{
      price.textContent=money(
        item.prices[select.value]
      );
    };

    select.onchange=updatePrice;
    updatePrice();

    const btn=document.createElement("button");
    btn.className="add";
    btn.textContent="+ Tambah";
    btn.onclick=()=>addToCart(item.id,select.value);

    bottom.append(price,btn);
    body.append(cat,name,select,bottom);
    card.append(photoWrap,body);
    root.appendChild(card);
  });
}

$("searchInput").addEventListener(
  "input",renderMenu
);

/* CART */

function addToCart(id,variant){
  const item=menu.find(x=>x.id===id);
  if(!item)return;

  const key=id+"|"+variant;
  const existing=cart.find(x=>x.key===key);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      key,
      id,
      name:item.name,
      variant,
      price:item.prices[variant],
      quantity:1
    });
  }

  renderCart();
  openCart();
}

function changeQty(key,delta){
  const item=cart.find(x=>x.key===key);
  if(!item)return;

  item.quantity+=delta;

  if(item.quantity<=0){
    cart=cart.filter(x=>x.key!==key);
  }

  renderCart();
}

function renderCart(){
  const root=$("cartItems");
  root.replaceChildren();

  if(!cart.length){
    const p=document.createElement("p");
    p.textContent="Troli anda masih kosong.";
    p.style.color="#897662";
    p.style.padding="20px 0";
    root.appendChild(p);
  }

  cart.forEach(item=>{
    const row=document.createElement("div");
    row.className="cart-item";

    const info=document.createElement("div");

    const name=document.createElement("strong");
    name.textContent=item.name;

    const variant=document.createElement("small");
    variant.textContent=item.variant+
      " • "+money(item.price);

    const controls=document.createElement("div");
    controls.className="qty";

    const minus=document.createElement("button");
    minus.textContent="−";
    minus.onclick=()=>changeQty(item.key,-1);

    const qty=document.createElement("span");
    qty.textContent=item.quantity;

    const plus=document.createElement("button");
    plus.textContent="+";
    plus.onclick=()=>changeQty(item.key,1);

    controls.append(minus,qty,plus);
    info.append(name,variant,controls);

    const subtotal=document.createElement("strong");
    subtotal.textContent=money(
      item.price*item.quantity
    );

    row.append(info,subtotal);
    root.appendChild(row);
  });

  $("cartCount").textContent=cart.reduce(
    (sum,x)=>sum+x.quantity,0
  );

  $("cartTotal").textContent=money(
    cart.reduce(
      (sum,x)=>sum+x.price*x.quantity,0
    )
  );

  $("checkoutBtn").disabled=
    submitting||cart.length===0;
}

function openCart(){
  $("overlay").classList.add("show");
  $("cartPanel").classList.add("show");
}

function closeCart(){
  $("overlay").classList.remove("show");
  $("cartPanel").classList.remove("show");
}

function showMessage(text){
  $("message").textContent=text;
  $("message").style.display="block";
}

/* SUPABASE CHECKOUT */

async function submitOrder(){
  if(submitting)return;

  const customer=$("customerName").value.trim();
  const table=$("tableNumber").value.trim();

  if(!customer||!table){
    showMessage(
      "Sila isi nama pelanggan dan nombor meja."
    );
    return;
  }

  if(!cart.length){
    showMessage("Troli masih kosong.");
    return;
  }

  submitting=true;
  renderCart();
  showMessage("Sedang menghantar pesanan...");

  try{
    const total=cart.reduce(
      (sum,x)=>sum+x.price*x.quantity,0
    );

    const {data:order,error:orderError}=
      await db.from("orders")
        .insert({
          customer_name:customer,
          table_number:table,
          total_amount:total,
          status:"pending"
        })
        .select("id")
        .single();

    if(orderError)throw orderError;

    const items=cart.map(item=>({
      order_id:order.id,
      product_name:item.name+
        (item.variant==="Regular"?
          "":" ("+item.variant+")"),
      quantity:item.quantity,
      price:item.price,
      subtotal:item.price*item.quantity
    }));

    const {error:itemError}=
      await db.from("order_items")
        .insert(items);

    if(itemError){
      throw new Error(
        "Pesanan utama telah direkodkan tetapi "+
        "item gagal disimpan. Hubungi staf sebelum "+
        "mencuba lagi. ID: "+order.id+
        ". "+itemError.message
      );
    }

    cart=[];
    renderCart();

    showMessage(
      "✓ Pesanan berjaya dihantar! "+
      "Nombor pesanan: "+
      String(order.id).slice(-8)+
      ". Terima kasih kerana memilih Ruang Kopi Kita."
    );

  }catch(err){
    showMessage("Ralat: "+err.message);
  }finally{
    submitting=false;
    renderCart();
  }
}

/* START */

renderCategories();
renderMenu();
renderCart();

</script>
