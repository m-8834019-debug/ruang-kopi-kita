
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<title>Ruang Kopi Kita</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}
html { scroll-behavior: smooth; }
body { background: #f6efe5; color: #3d281f; }

header {
    background: #3b2418;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}
.logo { font-size: 23px; font-weight: bold; }
nav { display: flex; gap: 20px; align-items: center; }
nav a { color: white; text-decoration: none; }
.cart-button {
    background: #b88955;
    padding: 10px 15px;
    border-radius: 20px;
}
.hero {
    background:
      linear-gradient(rgba(55,35,22,.75),rgba(55,35,22,.75)),
      url("https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
    min-height: 430px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 30px;
}
.hero h1 { font-size: 48px; margin-bottom: 15px; }
.hero p { font-size: 19px; margin-bottom: 25px; }
.hero button {
    background: #c69a6b;
    border: none;
    color: white;
    padding: 14px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 20px 7%;
    background: white;
}
.category-btn {
    white-space: nowrap;
    border: none;
    background: #ead9c6;
    color: #4b3022;
    padding: 10px 17px;
    border-radius: 20px;
    cursor: pointer;
}
.category-btn.active { background: #5b3827; color: white; }

.section {
    max-width: 1200px;
    margin: auto;
    padding: 45px 20px;
}
.section-title { text-align: center; margin-bottom: 35px; }
.section-title h2 { font-size: 32px; margin-bottom: 8px; }
.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
    gap: 20px;
}
.menu-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,.09);
    transition: .2s;
}
.menu-card:hover { transform: translateY(-4px); }
.menu-image {
    height: 150px;
    background: #d8c1a8;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
}
.menu-info { padding: 20px; }
.menu-info h3 { margin-bottom: 8px; font-size: 19px; }
.menu-info p { color: #777; font-size: 14px; }
.price { font-size: 18px; font-weight: bold; margin: 15px 0; }
.price-options {
    display: flex;
    gap: 7px;
    margin-top: 12px;
    flex-wrap: wrap;
}
.price-options button {
    border: 1px solid #8b6048;
    background: white;
    color: #5a3827;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
}
.price-options button.selected {
    background: #5a3827;
    color: white;
}
.add-button {
    width: 100%;
    border: none;
    background: #6b4531;
    color: white;
    padding: 11px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 10px;
}
.add-button:hover { background: #43291d; }

.cart-section {
    background: white;
    max-width: 900px;
    margin: 20px auto 60px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}
.cart-section h2 { margin-bottom: 20px; }
.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}
.cart-name { font-weight: bold; }
.quantity { display: flex; align-items: center; gap: 8px; }
.quantity button {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 5px;
    background: #ead9c6;
    cursor: pointer;
}
.remove {
    color: #b3261e;
    cursor: pointer;
    border: none;
    background: none;
}
.total-box {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #5a3827;
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: bold;
}
.order-form { margin-top: 30px; }
.order-form h3 { margin-bottom: 15px; }
.order-form input {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
}
.order-button {
    width: 100%;
    background: #3b2418;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
.order-button:disabled { opacity: .6; cursor: not-allowed; }
.order-result {
    display: none;
    background: #f6efe5;
    border: 1px solid #c69a6b;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}
footer {
    background: #3b2418;
    color: white;
    text-align: center;
    padding: 25px;
}
@media(max-width:700px) {
    header { flex-direction: column; gap: 12px; }
    nav { gap: 12px; }
    nav a { font-size: 14px; }
    .hero h1 { font-size: 32px; }
    .hero { min-height: 350px; }
    .cart-item { flex-wrap: wrap; }
    .cart-section { margin-left: 12px; margin-right: 12px; padding: 20px; }
}
</style>
</head>

<body>

    {category:"addon",name:"Espresso Shot",icon:"☕",prices:{Regular:3}},

    {category:"addon",name:"Flavoured Syrup",icon:"🍯",prices:{Regular:2}},
    {category:"addon",name:"Whipping Cream",icon:"🍦",prices:{Regular:2}},
    {category:"addon",name:"Drizzle",icon:"🍫",prices:{Regular:1}},
    {category:"addon",name:"Pure Matcha",icon:"🍃",prices:{Regular:1}}
];

/* PAPAR MENU */

const menuGrid = document.getElementById("menuGrid");
const selectedOptions = {};

function displayMenu(category = "all") {
    menuGrid.innerHTML = "";

    const filtered = category === "all"
        ? menu
        : menu.filter(item => item.category === category);

    filtered.forEach(item => {
        const index = menu.indexOf(item);
        const types = Object.keys(item.prices);

        const card = document.createElement("div");
        card.className = "menu-card";

        const image = document.createElement("div");
        image.className = "menu-image";
        image.textContent = item.icon;

        const info = document.createElement("div");
        info.className = "menu-info";

        const heading = document.createElement("h3");
        heading.textContent = item.name;

        const description = document.createElement("p");
        description.textContent = "Ruang Kopi Kita";

        info.appendChild(heading);
        info.appendChild(description);

        if (types.length > 1) {
            const options = document.createElement("div");
            options.className = "price-options";

            const selected = selectedOptions[index] || types[0];

            types.forEach(type => {
                const button = document.createElement("button");
                button.textContent =
                    type + " RM " + item.prices[type].toFixed(2);

                if (type === selected) {
                    button.classList.add("selected");
                }

                button.addEventListener("click", () => {
                    selectedOptions[index] = type;

                    options.querySelectorAll("button")
                        .forEach(btn => btn.classList.remove("selected"));

                    button.classList.add("selected");
                });

                options.appendChild(button);
            });

            info.appendChild(options);
        } else {
            const price = document.createElement("div");
            price.className = "price";
            price.textContent =
                "RM " + item.prices[types[0]].toFixed(2);

            info.appendChild(price);
        }

        const addButton = document.createElement("button");
        addButton.className = "add-button";
        addButton.textContent = "+ Tambah ke Cart";

        addButton.addEventListener("click", () => addMenuItem(index));

        info.appendChild(addButton);
        card.appendChild(image);
        card.appendChild(info);
        menuGrid.appendChild(card);
    });
}

/* TROLI */

let cart = [];

function addMenuItem(index) {
    const item = menu[index];
    const types = Object.keys(item.prices);
    const selected = selectedOptions[index] || types[0];
    const price = item.prices[selected];

    const existing = cart.find(
        entry => entry.name === item.name &&
                 entry.option === selected
    );

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            name: item.name,
            option: selected,
            price: price,
            quantity: 1
        });
    }

    updateCart();
    document.getElementById("cart").scrollIntoView({
        behavior: "smooth"
    });
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    const cartCount = document.getElementById("cartCount");
    const totalElement = document.getElementById("total");

    cartItems.innerHTML = "";

    if (cart.length === 0) {
        cartItems.textContent = "Belum ada pesanan.";
        cartCount.textContent = "0";
        totalElement.textContent = "0.00";
        return;
    }

    let total = 0;
    let count = 0;

    cart.forEach((item, index) => {
        const subtotal = item.price * item.quantity;
        total += subtotal;
        count += item.quantity;

        const row = document.createElement("div");
        row.className = "cart-item";

        const details = document.createElement("div");

        const name = document.createElement("div");
        name.className = "cart-name";
        name.textContent = item.name;

        const option = document.createElement("small");
        option.textContent =
            item.option + " - RM " + item.price.toFixed(2);

        details.appendChild(name);
        details.appendChild(option);

        const quantity = document.createElement("div");
        quantity.className = "quantity";

        const minus = document.createElement("button");
        minus.textContent = "−";
        minus.addEventListener("click", () => changeQuantity(index, -1));

        const number = document.createElement("span");
        number.textContent = item.quantity;

        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.addEventListener("click", () => changeQuantity(index, 1));

        quantity.appendChild(minus);
        quantity.appendChild(number);
        quantity.appendChild(plus);

        const amount = document.createElement("strong");
        amount.textContent = "RM " + subtotal.toFixed(2);

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.textContent = "Buang";
        remove.addEventListener("click", () => removeItem(index));

        row.appendChild(details);
        row.appendChild(quantity);
        row.appendChild(amount);
        row.appendChild(remove);
        cartItems.appendChild(row);
    });

    cartCount.textContent = count;
    totalElement.textContent = total.toFixed(2);
}

function changeQuantity(index, amount) {
    if (!cart[index]) return;

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    updateCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
}

/* KATEGORI */

function filterMenu(category, button) {
    document.querySelectorAll(".category-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
    displayMenu(category);
}

function goToMenu() {
    document.getElementById("menu").scrollIntoView({
        behavior: "smooth"
    });
}

/* HANTAR PESANAN KE SUPABASE */

let isSubmitting = false;

async function submitOrder() {
    if (isSubmitting) return;

    if (cart.length === 0) {
        alert("Sila pilih makanan atau minuman dahulu.");
        return;
    }

    const name = document.getElementById("customerName").value.trim();
    const table = document.getElementById("tableNumber").value.trim();

    if (!name || !table) {
        alert("Sila masukkan nama pelanggan dan nombor meja.");
        return;
    }

    if (!supabaseClient) {
        alert("Sambungan Supabase gagal dimuatkan. Sila refresh website.");
        return;
    }

    const items = cart.map(item => ({
        name: item.name,
        option: item.option,
        quantity: item.quantity
    }));

    const button = document.getElementById("submitButton");
    const result = document.getElementById("orderResult");

    isSubmitting = true;
    button.disabled = true;
    button.textContent = "⏳ Sedang menghantar...";
    result.style.display = "none";

    try {
        const { data, error } = await supabaseClient.rpc(
            "submit_customer_order",
            {
                p_customer_name: name,
                p_table_number: table,
                p_items: items
            }
        );

        if (error) throw error;

        if (typeof data !== "string" || !data.startsWith("RK-")) {
            throw new Error("Nombor pesanan tidak diterima.");
        }

        result.replaceChildren();

        const title = document.createElement("h3");
        title.textContent = "✅ Pesanan Berjaya Dihantar!";

        const orderNo = document.createElement("p");
        orderNo.textContent = "Nombor Pesanan: " + data;

        const customer = document.createElement("p");
        customer.textContent = "Nama: " + name;

        const tableInfo = document.createElement("p");
        tableInfo.textContent = "Meja: " + table;

        const status = document.createElement("p");
        status.textContent = "Status: Baharu";

        result.append(title, orderNo, customer, tableInfo, status);
        result.style.display = "block";

        cart = [];
        updateCart();

        document.getElementById("customerName").value = "";
        document.getElementById("tableNumber").value = "";

        result.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    } catch (error) {
        console.error("Ralat Supabase:", error);

        alert(
            "Pesanan gagal dihantar.\n\n" +
            (error.message || "Sila cuba lagi.")
        );

    } finally {
        isSubmitting = false;
        button.disabled = false;
        button.textContent = "✅ Hantar Pesanan";
    }
}

/* MULA */

displayMenu();
updateCart();

</script>
