<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;

body {
    background: #f6efe5;
    color: #3d281f;
}

/* ================= HEADER ================= */

header {
    background: #3b2418;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 23px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

.cart-button {
    background: #b88955;
    padding: 10px 15px;
    border-radius: 20px;
    cursor: pointer;
}

/* ================= HERO ================= */

.hero {
    background:
        linear-gradient(rgba(55,35,22,.75),rgba(55,35,22,.75)),
        url("https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1600&q=80");

    background-size: cover;
    background-position: center;

    min-height: 430px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    color: white;
    padding: 30px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 19px;
    margin-bottom: 25px;
}

.hero button {
    background: #c69a6b;
    border: none;
    color: white;
    padding: 14px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

/* ================= CATEGORY ================= */

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 20px 7%;
    background: white;
}

.category-btn {
    white-space: nowrap;
    border: none;
    background: #ead9c6;
    color: #4b3022;
    padding: 10px 17px;
    border-radius: 20px;
    cursor: pointer;
}

.category-btn.active {
    background: #5b3827;
    color: white;
}

/* ================= MENU ================= */

.section {
    max-width: 1200px;
    margin: auto;
    padding: 45px 20px;
}

.section-title {
    text-align: center;
    margin-bottom: 35px;
}

.section-title h2 {
    font-size: 32px;
    margin-bottom: 8px;
}

.menu-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.menu-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,.09);
    transition: .2s;
}

.menu-card:hover {
    transform: translateY(-4px);
}

.menu-image {
    height: 150px;
    background: #d8c1a8;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
}

.menu-info {
    padding: 20px;
}

.menu-info h3 {
    margin-bottom: 8px;
    font-size: 19px;
}

.menu-info p {
    color: #777;
    font-size: 14px;
    min-height: 20px;
}

.price {
    font-size: 18px;
    font-weight: bold;
    margin: 15px 0;
}

.price-options {
    display: flex;
    gap: 7px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.price-options button {
    border: 1px solid #8b6048;
    background: white;
    color: #5a3827;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
}

.price-options button.selected {
    background: #5a3827;
    color: white;
}

.add-button {
    width: 100%;
    border: none;
    background: #6b4531;
    color: white;
    padding: 11px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 10px;
}

.add-button:hover {
    background: #43291d;
}

/* ================= CART ================= */

.cart-section {
    background: #fff;
    max-width: 900px;
    margin: 20px auto 60px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.cart-section h2 {
    margin-bottom: 20px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
}

.cart-name {
    font-weight: bold;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 8px;
}

.quantity button {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 5px;
    background: #ead9c6;
    cursor: pointer;
}

.remove {
    color: #b3261e;
    cursor: pointer;
    border: none;
    background: none;
}

.total-box {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #5a3827;
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: bold;
}

/* ================= ORDER FORM ================= */

}

.order-form h3 {
    margin-bottom: 15px;
}

.order-form input {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;

.order-button {

    background: #3b2418;
    color: white;

/* ================= FOOTER ================= */

footer {

/* ================= MOBILE ================= */

        align-items: flex-start;
    }

}

</style>

/* =====================================================
   PAPAR MENU
===================================================== */

const menuGrid =
    document.getElementById("menuGrid");


function displayMenu(category = "all") {

    menuGrid.innerHTML = "";

    const filtered =
        category === "all"
        ? menu
        : menu.filter(item => item.category === category);


    filtered.forEach((item, index) => {

        const card =
            document.createElement("div");

        card.className = "menu-card";


        let options = "";

        const priceTypes =
            Object.keys(item.prices);


        if (priceTypes.length > 1) {

            options = `
                <div class="price-options">

                    ${priceTypes.map((type, i) => `
                        <button
                            class="${i === 0 ? "selected" : ""}"
                            onclick="selectOption(
                                ${index},
                                '${type}',
                                this
                            )">

                            ${type}
                            RM ${item.prices[type].toFixed(2)}

                        </button>
                    `).join("")}

                </div>
            `;

        } else {

            options = `
                <div class="price">
                    RM ${item.prices[priceTypes[0]].toFixed(2)}
                </div>
            `;

        }


        card.innerHTML = `

            <div class="menu-image">
                ${item.icon}
            </div>

            <div class="menu-info">

                <h3>
                    ${item.name}
                </h3>

                <p>
                    Ruang Kopi Kita
                </p>

                ${options}

                <button
                    class="add-button"
                    onclick="addMenuItem(${menu.indexOf(item)})">

                    + Tambah ke Cart

                </button>

            </div>
        `;


        menuGrid.appendChild(card);

    });

}


/* =====================================================
   PILIH HOT / COLD
===================================================== */

const selectedOptions = {};


function selectOption(index, type, button) {

    selectedOptions[index] = type;

    const parent =
        button.parentElement;

    parent
        .querySelectorAll("button")
        .forEach(btn =>
            btn.classList.remove("selected")
        );

    button.classList.add("selected");

}


/* =====================================================
   CART
===================================================== */

let cart = [];


function addMenuItem(index) {

    const item = menu[index];

    const types =
        Object.keys(item.prices);

    const selected =
        selectedOptions[index] || types[0];

    const price =
        item.prices[selected];


    cart.push({

        name: item.name,

        option: selected,

        price: price,

        quantity: 1

    });


    updateCart();

    document
        .getElementById("cart")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

    const cartItems =
        document.getElementById("cartItems");

    const cartCount =
        document.getElementById("cartCount");

    const totalElement =
        document.getElementById("total");


    if (cart.length === 0) {

        cartItems.innerHTML =
            "<p>Belum ada pesanan.</p>";

        cartCount.innerText = "0";

        totalElement.innerText = "0.00";

        return;

    }


    cartItems.innerHTML = "";

    let total = 0;

    let count = 0;


    cart.forEach((item, index) => {

        const subtotal =
            item.price * item.quantity;

        total += subtotal;

        count += item.quantity;


        const row =
            document.createElement("div");

        row.className = "cart-item";


        row.innerHTML = `

            <div>

                <div class="cart-name">
                    ${item.name}
                </div>

                <small>
                    ${item.option}
                    - RM ${item.price.toFixed(2)}
                </small>

            </div>


            <div class="quantity">

                <button
                    onclick="changeQuantity(
                        ${index},
                        -1
                    )">
                    −
                </button>

                <span>
                    ${item.quantity}
                </span>

                <button
                    onclick="changeQuantity(
                        ${index},
                        1
                    )">
                    +
                </button>

            </div>


            <strong>
                RM ${subtotal.toFixed(2)}
            </strong>


            <button
                class="remove"
                onclick="removeItem(${index})">

                Buang

            </button>

        `;


        cartItems.appendChild(row);

    });


    cartCount.innerText = count;

    totalElement.innerText =
        total.toFixed(2);

}


/* =====================================================
   KUANTITI
===================================================== */

function changeQuantity(index, amount) {

    cart[index].quantity += amount;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    updateCart();

}


/* =====================================================
   BUANG
===================================================== */

function removeItem(index) {

    cart.splice(index, 1);

    updateCart();

}


/* =====================================================
   FILTER
===================================================== */

function filterMenu(category, button) {

    document
        .querySelectorAll(".category-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    displayMenu(category);

}


/* =====================================================
   SCROLL MENU
===================================================== */

function goToMenu() {

    document
        .getElementById("menu")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =====================================================
   HANTAR PESANAN
===================================================== */

function submitOrder() {

    if (cart.length === 0) {

        alert("Sila pilih makanan atau minuman dahulu.");

        return;

    }


    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const table =
        document
        .getElementById("tableNumber")
        .value
        .trim();


    if (!name || !table) {

        alert(
            "Sila masukkan nama pelanggan dan nombor meja."
        );

        return;

    }


    let message =
        "PESANAN RUANG KOPI KITA\n\n";


    message +=
        "Nama: " + name + "\n";

    message +=
        "Meja: " + table + "\n\n";


    let total = 0;


    cart.forEach(item => {

        const subtotal =
            item.price * item.quantity;

        total += subtotal;


        message +=
            item.name +
            " (" +
            item.option +
            ") x" +
            item.quantity +
            " = RM " +
            subtotal.toFixed(2) +
            "\n";

    });


    message +=
        "\nJUMLAH: RM " +
        total.toFixed(2);


    alert(
        "Pesanan berjaya disediakan!\n\n" +
        message
    );

}


/* =====================================================
   MULA
===================================================== */

displayMenu();

</script>
