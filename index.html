<style>
:root{
  --dark:#38291F;
  --brown:#624734;
  --cream:#F7F0E3;
  --paper:#FFFAEF;
  --olive:#747C51;
  --gold:#B99865;
  --line:#D9C7A9;
  --muted:#897662;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--cream);
  color:var(--dark);
  font-family:"DM Sans",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
header{
  background:var(--dark);
  color:var(--paper);
  text-align:center;
  padding:26px 15px;
  border-bottom:6px double var(--gold);
}
.brand{
  font:700 clamp(29px,5vw,43px) "Playfair Display",serif;
}
header p{
  color:#D7BE98;
  letter-spacing:3px;
  font-size:11px;
  margin:9px 0 0;
}
.topbar{
  background:#E9DCC7;
  padding:13px 18px;
  text-align:center;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  border-bottom:1px solid var(--line);
}
.hero{
  max-width:1240px;
  margin:28px auto;
  padding:55px 25px;
  background:#E8D9BD;
  border:2px solid var(--brown);
  outline:5px solid #E8D9BD;
  outline-offset:3px;
  text-align:center;
  position:relative;
}
.hero:before,.hero:after{
  content:"✦";
  position:absolute;
  top:18px;
  font-size:27px;
  color:var(--gold);
}
.hero:before{left:22px}
.hero:after{right:22px}
.hero small{
  font-size:11px;
  letter-spacing:4px;
  color:var(--olive);
  font-weight:800;
}
.hero h1{
  font:700 clamp(35px,6vw,65px) "Playfair Display",serif;
  margin:15px 0;
}
.hero p{
  font-style:italic;
  color:#715944;
  font-size:16px;
}
.hero button,.add,.checkout{
  background:var(--olive);
  color:white;
  border:1px solid var(--dark);
  padding:13px 22px;
  font-weight:800;
}
.hero button{margin-top:20px}
.hero button:hover,.add:hover,.checkout:hover{
  background:var(--dark);
}
.container{
  max-width:1300px;
  margin:auto;
  padding:20px 20px 110px;
}
.section-title{
  text-align:center;
  font:700 34px "Playfair Display",serif;
  margin:25px 0 10px;
}
.ornament{
  text-align:center;
  color:var(--gold);
  font-size:29px;
  margin-bottom:25px;
}
.search{
  width:100%;
  padding:16px;
  background:var(--paper);
  border:1px solid var(--line);
  outline:none;
  margin-bottom:19px;
}
.categories{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  justify-content:center;
  margin-bottom:28px;
}
.category-btn{
  background:#EDE1CF;
  color:var(--brown);
  border:1px solid var(--brown);
  padding:10px 14px;
  font-weight:800;
  font-size:12px;
}
.category-btn.active,.category-btn:hover{
  background:var(--dark);
  color:white;
}
.menu-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:22px;
}
.menu-card{
  background:var(--paper);
  border:1px solid var(--line);
  padding:9px;
  box-shadow:4px 4px 0 #DFD0B8;
  min-width:0;
}
.menu-picture{
  display:block;
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  background:#E8D9BD;
}
.menu-body{padding:15px 9px 10px}
.menu-category{
  color:var(--olive);
  text-transform:uppercase;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}
.menu-body h3{
  font:700 21px "Playfair Display",serif;
  margin:9px 0 12px;
  min-height:52px;
}
.menu-body select{
  width:100%;
  border:1px solid var(--line);
  background:#F7F0E3;
  color:var(--brown);
  padding:10px;
  margin-bottom:13px;
}
.menu-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
}
.price{
  font:700 19px "Playfair Display",serif;
  white-space:nowrap;
}
.add{
  padding:10px 11px;
  font-size:12px;
}
.cart-float{
  position:fixed;
  right:22px;
  bottom:22px;
  background:var(--dark);
  color:white;
  border:2px solid var(--gold);
  padding:16px 22px;
  font-weight:800;
  box-shadow:4px 4px 0 var(--gold);
  z-index:10;
}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#24180ECC;
  z-index:20;
}
.overlay.show{display:block}
.cart-panel{
  position:fixed;
  right:0;
  top:0;
  height:100dvh;
  width:min(450px,100%);
  background:var(--paper);
  z-index:21;
  padding:25px;
  overflow-y:auto;
  transform:translateX(105%);
  transition:transform .25s;
  box-shadow:-8px 0 25px #0002;
}
.cart-panel.show{transform:translateX(0)}
.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid var(--line);
  padding-bottom:15px;
}
.cart-head h2{
  font:700 29px "Playfair Display",serif;
  margin:0;
}
.close{
  background:none;
  border:0;
  font-size:30px;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:17px 0;
  border-bottom:1px solid var(--line);
}
.cart-item strong{display:block}
.cart-item small{
  display:block;
  color:var(--muted);
  margin-top:5px;
}
.qty{
  display:flex;
  gap:11px;
  align-items:center;
  margin-top:10px;
}
.qty button{
  background:#E8DCC8;
  border:1px solid var(--brown);
  width:30px;
  height:30px;
}
.total{
  display:flex;
  justify-content:space-between;
  margin:24px 0;
  font:700 23px "Playfair Display",serif;
}
label{
  display:block;
  margin:17px 0 7px;
  font-size:13px;
  font-weight:800;
}
.field{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  background:white;
}
.checkout{
  width:100%;
  margin-top:22px;
  padding:16px;
}
.message{
  margin-top:15px;
  padding:13px;
  border:1px solid var(--olive);
  background:#E9EBD9;
  font-size:13px;
  line-height:1.6;
  display:none;
  overflow-wrap:anywhere;

footer{
  background:var(--dark);
  color:#E1C8A3;
  text-align:center;
  padding:30px 15px;
  font-size:12px;
  letter-spacing:1px;
}
@media(max-width:1050px){
  .menu-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:750px){
  .menu-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
  .menu-grid{grid-template-columns:1fr}

  .hero{margin:24px 15px;padding:38px 16px}
  .container{padding:18px 15px 100px}

const menu=rawMenu.map((row,id)=>({
  id,

  icon:row[2],

}));

const categories={
  all:"✦ Semua",

  rice:"🍚 Rice Bowl",

let selectedCategory="all";

const $=id=>document.getElementById(id);

/*
 VINTAGE MENU ILLUSTRATION
 Setiap menu menerima ilustrasi tersendiri
 dengan nama dan simbol hidangan.
 Tiada pautan gambar luaran diperlukan.
*/

function svgEscape(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&apos;"
  }[c]));
}

function vintageImage(item){
  const palettes=[
    ["#E8D5B5","#79563C"],
    ["#D8DCC3","#596442"],
    ["#E6C9B4","#815342"],
    ["#DDD1BA","#6A6045"],
    ["#E5D9C8","#67503B"],
    ["#D4DABF","#576747"]
  ];

  const [bg,ink]=palettes[item.id%palettes.length];

  const name=svgEscape(item.name);
  const category=svgEscape(
    categories[item.category]||"CAFÉ MENU"
  );

  const words=item.name.split(" ");
  let lines=[];

  if(item.name.length>24){
    const midpoint=Math.ceil(words.length/2);
    lines=[
      words.slice(0,midpoint).join(" "),
      words.slice(midpoint).join(" ")
    ];
  }else{
    lines=[item.name];
  }

  const title=lines.map((line,i)=>
    `<text x="400" y="${442+i*35}"
       text-anchor="middle"
       font-family="Georgia,serif"
       font-size="${line.length>25?23:29}"
       font-weight="bold"
       fill="${ink}">${svgEscape(line)}</text>`
  ).join("");

  const svg=`
  <svg xmlns="http://www.w3.org/2000/svg"
       width="800" height="600"
       viewBox="0 0 800 600">

    <rect width="800" height="600" fill="${bg}"/>

    <rect x="25" y="25" width="750" height="550"
      fill="none" stroke="${ink}" stroke-width="3"/>

    <rect x="37" y="37" width="726" height="526"
      fill="none" stroke="${ink}"
      stroke-width="1" opacity=".5"/>

    <circle cx="400" cy="245" r="155"
      fill="#FFF8E8" stroke="${ink}" stroke-width="3"/>

    <circle cx="400" cy="245" r="140"
      fill="none" stroke="${ink}"
      stroke-dasharray="3 9" opacity=".6"/>

    <text x="400" y="91"
      text-anchor="middle"
      font-size="19"
      letter-spacing="6"
      font-family="Georgia,serif"
      fill="${ink}">RUANG KOPI KITA</text>

    <text x="400" y="315"
      text-anchor="middle"
      font-size="130">${item.icon}</text>

    <text x="400" y="395"
      text-anchor="middle"
      font-size="15"
      letter-spacing="4"
      fill="${ink}"
      font-family="Georgia,serif">${category}</text>

    ${title}

    <path d="M240 520 H350 M450 520 H560"
      stroke="${ink}" stroke-width="2"/>

    <text x="400" y="527"
      text-anchor="middle"
      font-size="27"
      fill="${ink}">✦</text>
  </svg>`;

  return "data:image/svg+xml;charset=utf-8,"+
    encodeURIComponent(svg);
}

/* CATEGORY */

function renderCategories(){
  const root=$("categories");
  root.replaceChildren();

  Object.entries(categories).forEach(([key,label])=>{
    const btn=document.createElement("button");
    btn.className="category-btn"+
      (selectedCategory===key?" active":"");
    btn.textContent=label;

    btn.onclick=()=>{
      selectedCategory=key;
      renderCategories();
      renderMenu();
    };

    root.appendChild(btn);
  });
}

/* MENU */

function renderMenu(){
  const root=$("menuGrid");
  root.replaceChildren();

  const query=$("searchInput").value
    .toLowerCase().trim();

  const filtered=menu.filter(item=>
    (selectedCategory==="all"||
      item.category===selectedCategory) &&
    item.name.toLowerCase().includes(query)
  );

  if(!filtered.length){
    const p=document.createElement("p");
    p.textContent="Tiada menu ditemui.";
    root.appendChild(p);
    return;
  }

  filtered.forEach(item=>{
    const card=document.createElement("article");
    card.className="menu-card";

    const img=document.createElement("img");
    img.className="menu-picture";
    img.src=vintageImage(item);
    img.alt="Ilustrasi vintage "+item.name;
    img.loading="lazy";

    const body=document.createElement("div");
    body.className="menu-body";

    const cat=document.createElement("div");
    cat.className="menu-category";
    cat.textContent=categories[item.category];

    const name=document.createElement("h3");
    name.textContent=item.name;

    const select=document.createElement("select");
    select.setAttribute("aria-label",
      "Pilihan "+item.name);

    Object.entries(item.prices).forEach(
      ([variant,price])=>{
        const opt=document.createElement("option");
        opt.value=variant;
        opt.textContent=variant+" — "+money(price);
        select.appendChild(opt);
      }
    );

    const bottom=document.createElement("div");
    bottom.className="menu-bottom";

    const price=document.createElement("span");
    price.className="price";

    const updatePrice=()=>{
      price.textContent=money(
        item.prices[select.value]
      );
    };

    select.onchange=updatePrice;
    updatePrice();

    const btn=document.createElement("button");
    btn.className="add";
    btn.textContent="+ Tambah";

    btn.onclick=()=>addToCart(item.id,select.value);

    bottom.append(price,btn);
    body.append(cat,name,select,bottom);
    card.append(img,body);
    root.appendChild(card);
  });
}

$("searchInput").addEventListener(
  "input",renderMenu
);

/* CART */

function addToCart(id,variant){
  const item=menu.find(x=>x.id===id);
  if(!item)return;

  const key=id+"|"+variant;

  const existing=cart.find(x=>x.key===key);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      key,
      id,
      name:item.name,
      variant,
      price:item.prices[variant],
      quantity:1
    });
  }

  renderCart();
  openCart();
}

function changeQty(key,delta){
  const item=cart.find(x=>x.key===key);
  if(!item)return;

  item.quantity+=delta;

  if(item.quantity<=0){
    cart=cart.filter(x=>x.key!==key);
  }

  renderCart();
}

function renderCart(){
  const root=$("cartItems");
  root.replaceChildren();

  if(!cart.length){
    const p=document.createElement("p");
    p.textContent="Troli anda masih kosong.";
    p.style.color="#897662";
    p.style.padding="20px 0";
    root.appendChild(p);
  }

  cart.forEach(item=>{
    const row=document.createElement("div");
    row.className="cart-item";

    const info=document.createElement("div");

    const name=document.createElement("strong");
    name.textContent=item.name;

    const variant=document.createElement("small");
    variant.textContent=item.variant+
      " • "+money(item.price);

    const controls=document.createElement("div");
    controls.className="qty";

    const minus=document.createElement("button");
    minus.textContent="−";
    minus.onclick=()=>changeQty(item.key,-1);

    const qty=document.createElement("span");
    qty.textContent=item.quantity;

    const plus=document.createElement("button");
    plus.textContent="+";
    plus.onclick=()=>changeQty(item.key,1);

    controls.append(minus,qty,plus);
    info.append(name,variant,controls);

    const subtotal=document.createElement("strong");
    subtotal.textContent=money(
      item.price*item.quantity
    );

    row.append(info,subtotal);
    root.appendChild(row);
  });

  $("cartCount").textContent=cart.reduce(
    (sum,x)=>sum+x.quantity,0
  );

  $("cartTotal").textContent=money(
    cart.reduce(
      (sum,x)=>sum+x.price*x.quantity,0
    )
  );

  $("checkoutBtn").disabled=
    submitting||cart.length===0;
}

function openCart(){
  $("overlay").classList.add("show");
  $("cartPanel").classList.add("show");
}

function closeCart(){
  $("overlay").classList.remove("show");
  $("cartPanel").classList.remove("show");
}

function showMessage(text){
  $("message").textContent=text;
  $("message").style.display="block";
}

/* SUPABASE CHECKOUT */

async function submitOrder(){
  if(submitting)return;

  const customer=$("customerName").value.trim();
  const table=$("tableNumber").value.trim();

  if(!customer||!table){
    showMessage(
      "Sila isi nama pelanggan dan nombor meja."
    );
    return;
  }

  if(!cart.length){
    showMessage("Troli masih kosong.");
    return;
  }

  submitting=true;
  renderCart();

  showMessage("Sedang menghantar pesanan...");

  try{
    const total=cart.reduce(
      (sum,x)=>sum+x.price*x.quantity,0
    );

    const {data:order,error:orderError}=
      await db.from("orders")
        .insert({
          customer_name:customer,
          table_number:table,
          total_amount:total,
          status:"pending"
        })
        .select("id")
        .single();

    if(orderError)throw orderError;

    const items=cart.map(item=>({
      order_id:order.id,
      product_name:item.name+
        (item.variant==="Regular"?
          "":" ("+item.variant+")"),
      quantity:item.quantity,
      price:item.price,
      subtotal:item.price*item.quantity
    }));

    const {error:itemError}=
      await db.from("order_items")
        .insert(items);

    if(itemError){
      throw new Error(
        "Pesanan utama sudah direkodkan tetapi item "+
        "gagal disimpan. Hubungi staf sebelum "+
        "mencuba lagi. ID: "+order.id+
        ". "+itemError.message
      );
    }

    cart=[];
    renderCart();

    showMessage(
      "✓ Pesanan berjaya dihantar! "+
      "Nombor pesanan: "+
      String(order.id).slice(-8)+
      ". Terima kasih kerana memilih Ruang Kopi Kita."
    );

  }catch(err){
    showMessage("Ralat: "+err.message);
  }finally{
    submitting=false;
    renderCart();
  }
}

/* INITIALIZE */

renderCategories();
renderMenu();
renderCart();

</script>
