<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Ruang Kopi Kita</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f1eb;
            color: #3e2723;
        }

        header {
            background-color: #5d4037;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .dashboard-title {
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
        }

        .sales {
            border-left: 6px solid #4caf50;
        }

        .expenses {
            border-left: 6px solid #f44336;
        }

        .profit {
            border-left: 6px solid #795548;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input,
        select,
        button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            background-color: #5d4037;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #3e2723;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #efebe9;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>☕ Ruang Kopi Kita</h1>
    <p>Admin Dashboard</p>
</header>

<div class="container">

    <h2 class="dashboard-title">Dashboard Untung Rugi</h2>

    <!-- SUMMARY CARDS -->
    <div class="cards">

        <div class="card sales">
            <h3>Jumlah Sales</h3>
            <p class="amount">RM 0.00</p>
        </div>

        <div class="card expenses">
            <h3>Jumlah Belanja</h3>
            <p class="amount">RM 0.00</p>
        </div>

        <div class="card profit">
            <h3>Untung Bersih</h3>
            <p class="amount">RM 0.00</p>
        </div>

    </div>

    <!-- TAMBAH TRANSAKSI -->
    <div class="section">

        <h2>Tambah Transaksi</h2>

        <form>

            <select>
                <option>Pilih Jenis Transaksi</option>
                <option>Sales</option>
                <option>Belanja</option>
            </select>

            <input type="text" placeholder="Nama transaksi">

            <input type="number" placeholder="Jumlah (RM)" step="0.01">

            <input type="date">

            <button type="button">
                Simpan Transaksi
            </button>

        </form>

    </div>

    <!-- REKOD TRANSAKSI -->
    <div class="section">

        <h2>Rekod Transaksi</h2>

        <table>

            <thead>
                <tr>
                    <th>Tarikh</th>
                    <th>Jenis</th>
                    <th>Transaksi</th>
                    <th>Jumlah</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>-</td>
                    <td>-</td>
                    <td>Belum ada rekod</td>
                    <td>RM 0.00</td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
