
<!-- MODERN ELEGANT LUXURY — RUANG KOPI KITA -->
<style id="modernElegantLuxury2026">
:root {
  --dark:#211812;
  --brown:#39291f;
  --gold:#c7a06c;
  --cream:#f7f5f1;
  --line:#e9e2d8;
  --red:#b34b4b;
  --green:#247653;
}

html {
  color-scheme:light;
}

body {
  background:#f7f5f1 !important;
  color:#29211c !important;
  font-family:Arial,Helvetica,sans-serif !important;
  line-height:1.55;
}

/* HEADER */
body > header {
  background:#211812 !important;
  color:#fff !important;
  border-bottom:2px solid #c7a06c;
  padding:20px 30px !important;
  min-height:90px;
  box-shadow:0 5px 24px #21181218;
}

body > header h1 {
  color:#fff !important;
  font-family:Georgia,serif;
  font-size:27px;
  letter-spacing:.2px;
}

body > header small {
  color:#e2c8a7 !important;
}

#adminEmail {
  color:#f3e8db !important;
}

#logoutBtn {
  background:transparent !important;
  color:#fff !important;
  border:1px solid #c7a06c !important;
}

/* MAIN CONTENT */
main {
  max-width:1500px;
  padding:30px 28px 65px;
}

#dashboardSection {
  color:#29211c;
}

/* SIDEBAR */
@media(min-width:1051px) {
  body:has(#dashboardSection:not(.hidden)) main {
    margin-left:245px;
    max-width:none;
  }

  #dashboardSection:not(.hidden) > nav {
    position:fixed !important;
    top:90px;
    bottom:0;
    left:0;
    width:245px;
    margin:0 !important;
    padding:24px 13px !important;
    display:flex !important;
    flex-direction:column !important;
    flex-wrap:nowrap !important;
    gap:8px;
    background:#211812 !important;
    border-right:1px solid #49372a;
    overflow-y:auto;
    z-index:30;
  }

  #dashboardSection > nav .nav-btn {
    width:100%;
    text-align:left;
  }
}

/* NAVIGATION BUTTONS */
#dashboardSection nav .nav-btn {
  background:transparent !important;
  color:#eee0d1 !important;
  border:1px solid transparent !important;
  border-radius:10px !important;
  padding:13px 15px !important;
  font-size:13px;
  font-weight:600;
  transition:background .2s,color .2s;
}

#dashboardSection nav .nav-btn:hover {
  background:#483328 !important;
  color:#fff !important;
}

#dashboardSection nav .nav-btn.active {
  background:linear-gradient(
    120deg,#f0d6aa,#c69a60
  ) !important;
  color:#211812 !important;
  border-color:#d3aa74 !important;
  box-shadow:0 4px 12px #00000020;
}

/* PAGE TITLES */
.page-section > h2 {
  color:#211812 !important;
  font-family:Georgia,serif;
  font-size:clamp(25px,3vw,35px);
  font-weight:700;
  letter-spacing:-.5px;
  margin-bottom:8px;
}

.page-section > .subtitle {
  color:#786e65 !important;
  font-size:14px;
  line-height:1.65;
  margin-bottom:25px;
}

/* KPI CARDS */
.stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
  margin-bottom:24px;
}

.stat {
  position:relative;
  background:#fffdfa !important;
  color:#211812 !important;
  border:1px solid #e9e1d6 !important;
  border-radius:16px !important;
  padding:24px 22px !important;
  min-height:135px;
  overflow:hidden;
  box-shadow:0 5px 20px #2118120b;
  transition:transform .2s,box-shadow .2s;
}

.stat::before {
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(
    90deg,#b78a50,#e8d0aa
  );
}

.stat:hover {
  transform:translateY(-3px);
  box-shadow:0 10px 26px #21181215;
}

.stat span {
  display:block;
  color:#756b61 !important;
  font-size:13px;
  font-weight:600;
}

.stat strong {
  display:block;
  color:#211812 !important;
  font-size:clamp(20px,2.2vw,29px);
  font-weight:800;
  margin-top:14px;
  overflow-wrap:anywhere;
}

.stat strong.positive {
  color:#247653 !important;
}

.stat strong.negative {
  color:#b34b4b !important;
}

/* PANELS */
.panel,
.extra-card {
  background:#fffdfa !important;
  color:#29211c !important;
  border:1px solid #e9e1d6 !important;
  border-radius:16px !important;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #21181209;
}

.panel h3,
.extra-card h3 {
  color:#30241d !important;
  font-size:17px;
  font-weight:700;
  margin-top:0;
}

/* FORM INPUTS */
.field label,
.extra-card label {
  color:#39291f !important;
  font-size:13px;
  font-weight:700;
}

.field input,
.field select,
.field textarea,
.toolbar input,
.toolbar select,
.extra-card input,
.extra-card select {
  background:#fff !important;
  color:#29211c !important;
  border:1px solid #ddd3c8 !important;
  border-radius:9px !important;
  padding:12px 13px;
}

input:focus,
select:focus,
textarea:focus {
  outline:2px solid #d2a66f;
  outline-offset:1px;
}

/* BUTTONS */
.btn {
  background:#39291f !important;
  color:#fff !important;
  border:1px solid #39291f !important;
  border-radius:9px !important;
  font-weight:700;
  transition:filter .2s;
}

.btn:hover {
  opacity:1 !important;
  filter:brightness(1.15);
}

.btn.gold,
.btn.primary {
  background:#dfbb85 !important;
  color:#211812 !important;
  border-color:#dfbb85 !important;
}

.btn.red {
  background:#a84444 !important;
  color:#fff !important;
  border-color:#a84444 !important;
}

/* TABLES */
.table-wrap,
.extra-scroll {
  overflow-x:auto;
  border-radius:10px;
}

table {
  width:100%;
  background:#fffdfa !important;
  border-collapse:collapse;
}

th {
  background:#f1ebe4 !important;
  color:#463328 !important;
  font-weight:700;
  font-size:12px;
  padding:15px 13px;
}

td {
  background:#fffdfa !important;
  color:#392d25 !important;
  padding:14px 13px;
  border-bottom:1px solid #eee8e1;
}

tbody tr:hover td {
  background:#faf5ee !important;
}

/* REPORT */
.report-line {
  color:#30251e;
  border-color:#e9e1d6;
}

.report-line.heading {
  background:#f4ede3 !important;
  color:#39291f !important;
  border-radius:7px;
}

.report-line.final {
  background:#f0dfc5 !important;
  color:#211812 !important;
  border:1px solid #d9bb8d;
}

.positive,
.extra-positive {
  color:#247653 !important;
}

.negative,
.extra-negative {
  color:#b34b4b !important;
}

/* CHARTS */
.bar-sales,
.bar {
  background:#c19a65 !important;
}

.bar-profit {
  background:#247653 !important;
}

.bar-loss {
  background:#b34b4b !important;
}

.month-col small,
.barwrap small,
.status-note,
.muted {
  color:#786e65 !important;
}

.mini-row {
  border-color:#eee8e1;
}

/* NOTICES */
.note {
  background:#fcf6e9 !important;
  color:#5b4935 !important;
  border:1px solid #ead6ae !important;
  border-radius:10px;
}

.msg {
  border-radius:10px;
}

/* LOGIN */
.login {
  background:#fffdfa !important;
  color:#211812 !important;
  border:1px solid #e9e1d6 !important;
  border-radius:18px !important;
  box-shadow:0 12px 35px #21181215;
}

.login h2 {
  color:#211812 !important;
}

/* RESPONSIVE */
@media(max-width:1050px) {
  main {
    margin:0 !important;
    padding:24px 18px 55px;
  }

  #dashboardSection > nav {
    position:static !important;
    display:flex !important;
    flex-direction:row !important;
    flex-wrap:wrap !important;
    width:auto !important;

  }

  #dashboardSection nav .nav-btn {

  }

    background:#dfbb85 !important;
    color:#211812 !important;
  }

    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px) {

    padding:18px !important;
  }

  }

    padding:20px 13px 45px !important;
  }

  .stats,

  }

  }

/* PRINT REPORT */
@media print {

  nav,
  footer,
  .no-print,

  .panel,
  #reportSection {

  #reportSection .panel {

  }

</style>
