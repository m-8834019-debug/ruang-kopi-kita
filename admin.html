
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Kopi Kita | Panel Admin</title>
<style>
:root{
  --dark:#382318;
  --brown:#684630;
  --gold:#c49a6c;
  --cream:#f7f0e7;
  --line:#e8d9ca;
  --red:#ac4242;
  --green:#267347;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--cream);
  color:var(--dark);
  font-family:Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{
  background:var(--dark);
  color:white;
  padding:17px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
header h1{font-size:23px;margin:0}
header small{color:#e9c9a7}
main{
  max-width:1250px;
  margin:auto;
  padding:25px 18px 65px;
}
.btn{
  border:0;
  background:var(--brown);
  color:white;
  border-radius:9px;
  padding:11px 16px;
  font-weight:bold;
}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.55}
.gold{background:var(--gold);color:var(--dark)}
.red{background:var(--red)}
.small{padding:8px 11px;font-size:13px}
.login{
  max-width:440px;
  margin:50px auto;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 8px 30px #38231816;
}
.login h2,.login p{text-align:center}
.login p,.subtitle,.muted{color:#796b60}
.login .btn{width:100%}
.field{margin:14px 0}
.field label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}
.field input,.field select,.field textarea{
  width:100%;
  border:1px solid #d8c9ba;
  border-radius:8px;
  padding:12px;
  background:white;
}
.field textarea{min-height:75px}
nav{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:26px;
}
.nav-btn{
  background:white;
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px 17px;
  color:var(--brown);
  font-weight:bold;
}
.nav-btn.active{
  background:var(--brown);
  color:white;
}
h2{margin:0 0 7px}
.subtitle{
  margin:0 0 22px;
  line-height:1.5;
}
.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:22px;
  margin-bottom:20px;
}
.panel h3{margin-top:0}
.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
  margin-bottom:22px;
}
.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:20px;
}
.stat span{font-size:13px;color:#796b60}
.stat strong{
  display:block;
  font-size:25px;
  margin-top:12px;
  overflow-wrap:anywhere;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 16px;
}
.full{grid-column:1/-1}
.toolbar{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:17px;
}
.toolbar input,.toolbar select{
  padding:11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
}
.toolbar input[type=search]{
  flex:1;
  min-width:200px;
}
.table-wrap{overflow-x:auto}
table{
  border-collapse:collapse;
  width:100%;
  min-width:700px;
}
th,td{
  padding:13px 11px;
  text-align:left;
  border-bottom:1px solid #eee5db;
  font-size:14px;
  vertical-align:top;
}
th{
  background:#f7f0e7;
  color:var(--brown);
}
.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
