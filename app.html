
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211812">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Ruang Kopi Kita | Aplikasi Pengurusan</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #2a2019;
      background: #f7f4ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      background: #211812;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand strong {
      display: block;
      font-family: Georgia, serif;
      font-size: 22px;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: #d4b48a;
      font-size: 11px;
      letter-spacing: 1px;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #38271c;
      color: white;
      padding: 13px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .logout {
      display: none;
      background: #6b4930;
      padding: 10px 13px;
      font-size: 12px;
    }

    .login-wrap {
      max-width: 440px;
      margin: 8vh auto 30px;
      padding: 0 15px;
    }

    .login-card {
      background: white;
      padding: 30px;
      border: 1px solid #e6ded4;
      border-radius: 20px;
      box-shadow: 0 12px 35px #27180e15;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 28px;
      margin: 0 0 10px;
    }

    .muted {
      color: #766a5e;
      font-size: 14px;
      line-height: 1.7;
    }

    .field { margin: 20px 0; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8cbbd;
      border-radius: 10px;
      background: #fff;
      color: #211812;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #c8a77a;
      outline-offset: 1px;
    }

    .login-btn { width: 100%; }

    .notice {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: #fff1df;
      color: #794319;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden { display: none !important; }

    .dashboard {
      display: none;
      width: 100%;
    }

    .dashboard.active { display: block; }

    .dashboard-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: #f0e6d8;
      border-bottom: 1px solid #dfd1bf;
      font-size: 13px;
    }

    .dashboard-bar b { color: #38271c; }

    .dashboard-frame {
      display: block;
      width: 100%;
      height: calc(100dvh - 160px);
      min-height: 500px;
      border: 0;
      background: #f7f4ee;
    }

    @media (max-width: 600px) {
      .login-card { padding: 24px 20px; }
      .brand strong { font-size: 19px; }
      .dashboard-frame {
        height: calc(100dvh - 150px);
        min-height: 350px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <strong>☕ Ruang Kopi Kita</strong>
    <small>APLIKASI PENGURUSAN</small>
  </div>

  <button class="logout" id="logoutBtn" type="button">
    Log Keluar
  </button>
</header>

<main id="loginSection" class="login-wrap">
  <section class="login-card">
    <h1>Selamat Datang</h1>

    <p class="muted">
      Log masuk menggunakan akaun Admin atau Staf
      yang telah didaftarkan dalam sistem.
    </p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Kata Laluan</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button id="loginBtn" class="login-btn" type="submit">
        Log Masuk
      </button>
    </form>

    <div id="loginError" class="notice hidden"></div>
  </section>
</main>

<section id="dashboard" class="dashboard">
  <div class="dashboard-bar">
    <div>
      <b id="roleTitle">Dashboard</b>
      <div id="accountEmail"></div>
    </div>

    <button id="dashboardLogout" type="button">
      Log Keluar
    </button>
  </div>

  <iframe
    id="dashboardFrame"
    class="dashboard-frame"
    title="Ruang Kopi Kita Dashboard"
  ></iframe>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

// =====================================
// KONFIGURASI SUPABASE
// =====================================

const SUPABASE_URL =
  "https://ledcwlnyztcsvdedwmtq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_a1sRyLibWsIpRThtxfUbUQ_-Ksjebvl";

let db = null;
let currentUser = null;
let currentRole = null;

const $ = id => document.getElementById(id);

// =====================================
// PAPAR MESEJ RALAT
// =====================================

function showError(text) {
  const box = $("loginError");
  box.textContent = text || "";
  box.classList.toggle("hidden", !text);
}

// =====================================
// PAPAR LOGIN
// =====================================

function showLogin() {
  currentUser = null;
  currentRole = null;

  $("dashboardFrame").removeAttribute("src");
  $("dashboard").classList.remove("active");
  $("loginSection").classList.remove("hidden");
  $("logoutBtn").style.display = "none";
}

// =====================================
// PAPAR DASHBOARD MENGIKUT PERANAN
// =====================================

function showDashboard(user, role) {
  currentUser = user;
  currentRole = role;

  $("loginSection").classList.add("hidden");
  $("dashboard").classList.add("active");
  $("logoutBtn").style.display = "block";

  $("accountEmail").textContent = user.email || "";

  if (role === "admin") {
    $("roleTitle").textContent = "Panel Admin";
    $("dashboardFrame").src = "./admin.html";
  } else {
    $("roleTitle").textContent = "Panel Staf";
    $("dashboardFrame").src = "./staff.html";
  }
}

// =====================================
// SEMAK PERANAN PENGGUNA
// =====================================

async function checkRole(user) {
  const { data, error } = await db
    .from("user_roles")
    .select("role")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    throw new Error(
      "Gagal menyemak peranan pengguna: " + error.message
    );
  }

  const role = String(data?.role || "")
    .trim()
    .toLowerCase();

  if (role === "admin") {
    showDashboard(user, "admin");
    return;
  }

  if (role === "staff" || role === "staf") {
    showDashboard(user, "staff");
    return;
  }

  throw new Error(
    "Akaun ini belum mempunyai peranan Admin atau Staf. " +
    "Semak jadual user_roles dalam Supabase."
  );
}

// =====================================
// PROSES LOGIN
// =====================================

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("loginBtn");
  button.disabled = true;
  button.textContent = "Sedang Log Masuk...";

  showError("");

  try {
    if (!db) {
      throw new Error(
        "Supabase belum bersambung. Semak internet."
      );
    }

    const email = $("email").value.trim();
    const password = $("password").value;

    const { data, error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    if (!data?.user) {
      throw new Error("Maklumat akaun tidak diterima.");
    }

    await checkRole(data.user);

    $("password").value = "";

  } catch (error) {
    const errorText = error?.message || String(error);

    try {
      if (db) await db.auth.signOut();
    } catch (_) {}

    showLogin();
    showError(errorText);

  } finally {
    button.disabled = false;
    button.textContent = "Log Masuk";
  }
});

// =====================================
// LOG KELUAR
// =====================================

async function logout() {
  $("logoutBtn").disabled = true;
  $("dashboardLogout").disabled = true;

  try {
    if (db) {
      const { error } = await db.auth.signOut();
      if (error) throw error;
    }

    showLogin();
    showError("");

  } catch (error) {
    alert("Gagal log keluar: " + error.message);

  } finally {
    $("logoutBtn").disabled = false;
    $("dashboardLogout").disabled = false;
  }
}

$("logoutBtn").addEventListener("click", logout);
$("dashboardLogout").addEventListener("click", logout);

// =====================================
// MULAKAN APLIKASI
// =====================================

async function startApp() {
  try {
    if (!window.supabase?.createClient) {
      throw new Error(
        "Pustaka Supabase tidak berjaya dimuatkan."
      );
    }

    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const { data, error } = await db.auth.getUser();

    if (error && error.name !== "AuthSessionMissingError") {
      console.warn("Semakan sesi:", error.message);
    }

    if (data?.user) {
      try {
        await checkRole(data.user);
      } catch (roleError) {
        await db.auth.signOut();
        showLogin();
        showError(roleError.message);
      }
    }

  } catch (error) {
    console.error("Ralat aplikasi:", error);
    showError("Ralat aplikasi: " + error.message);
  }
}

startApp();

// =====================================
// SERVICE WORKER
// =====================================

if (
  "serviceWorker" in navigator &&
  location.protocol === "https:"
) {
  navigator.serviceWorker
    .register("./sw.js")
    .catch(error => console.warn(error));
}
</script>

</body>
</html>
