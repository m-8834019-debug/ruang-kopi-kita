<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Ruang Kopi Kita • App</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#2a2019;background:#f7f4ee}*{box-sizing:border-box}body{margin:0}header{background:#211812;color:#fff;padding:16px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-family:Georgia,serif;font-size:21px}header small{display:block;color:#d4b48a;font-size:11px;margin-top:3px}.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 90px}.login{max-width:420px;margin:8vh auto 0;background:white;padding:28px;border-radius:18px;box-shadow:0 12px 35px #27180e15;border:1px solid #e6ded4}h1,h2{font-family:Georgia,serif}h1{font-size:26px;margin:0 0 8px}h2{font-size:23px;margin:0 0 10px}.muted{color:#766a5e;font-size:14px;line-height:1.6}.field{margin:18px 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #d8cbbd;border-radius:10px;font:inherit;background:#fff;color:#211812}button{border:0;border-radius:10px;background:#38271c;color:white;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e9d4b5;color:#211812}.ghost{background:#493629;font-size:12px}.hidden{display:none!important}.notice{padding:12px;border-radius:9px;background:#fff1df;color:#6d3d15;margin:14px 0;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.pill{font-size:12px;color:#684d32;background:#efe2ce;padding:6px 10px;border-radius:20px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e9e1d6;border-radius:13px;padding:15px}.stat b{display:block;font-size:25px;color:#3b281c}.stat span{font-size:12px;color:#776b60}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tools button{padding:9px 13px;background:#eee6da;color:#3c2a1e}.tools button.active{background:#39291f;color:#fff}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.order{background:white;border:1px solid #e9e1d6;border-radius:16px;padding:17px;box-shadow:0 4px 14px #2118120a}.order-head{display:flex;justify-content:space-between;gap:8px;align-items:start}.order h3{margin:0 0 4px}.order p{margin:8px 0;font-size:14px}.order select{margin-top:8px}.order button{width:100%;margin-top:10px}.badge{background:#f3e5d0;color:#4c3421;border-radius:8px;padding:6px 8px;font-size:12px}.empty{background:white;border-radius:12px;padding:24px;text-align:center;color:#766a5e}.admin-frame{border:0;width:100%;height:calc(100dvh - 85px);display:block}.admin-mode{background:#f7f5f1}.admin-mode header{display:none}.admin-mode .wrap{display:none}.admin-mode .admin-frame{height:100dvh}body:not(.admin-mode) .admin-frame{display:none}#logout{display:none}@media(max-width:550px){.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat b{font-size:21px}.wrap{padding:18px 12px 90px}}
</style></head><body>
<header><div><strong>☕ Ruang Kopi Kita</strong><small>APLIKASI PENGURUSAN</small></div><button class="ghost" id="logout">Log Keluar</button></header>
<main class="wrap"><section id="login" class="login"><h1>Selamat Datang</h1><p class="muted">Log masuk sebagai Admin atau Staf menggunakan akaun yang didaftarkan.</p><div id="diagnostic" role="status" style="display:block;background:#fff1df;border:1px solid #d5ad78;border-radius:9px;padding:12px;margin:12px 0;color:#66431d;font-size:13px">Memeriksa sambungan aplikasi…</div><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Kata laluan</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" type="submit" style="width:100%">Log Masuk</button></form><div class="notice hidden" id="loginError"></div></section>
<section id="staff" class="hidden"><div class="top"><div><h2>Pesanan Pelanggan</h2><p class="muted" id="who"></p></div><span class="pill" id="connection">Memuatkan…</span></div><div class="stats"><div class="stat"><b id="newCount">0</b><span>Baharu</span></div><div class="stat"><b id="prepCount">0</b><span>Disediakan</span></div><div class="stat"><b id="readyCount">0</b><span>Sedia</span></div></div><div class="tools" id="filters"><button class="active" data-filter="all">Semua</button><button data-filter="active">Aktif</button><button data-filter="done">Selesai</button><button id="refresh" class="secondary">↻ Refresh</button></div><div id="error" class="notice hidden"></div><div id="orders" class="orders"></div></section></main><iframe id="adminFrame" class="admin-frame" title="Dashboard Admin" loading="lazy"></iframe>
<script>
window.addEventListener('error',function(e){var x=document.getElementById('diagnostic');if(x){x.textContent='Ralat JavaScript: '+(e.message||'tidak diketahui');x.style.display='block';}});
window.addEventListener('unhandledrejection',function(e){var x=document.getElementById('diagnostic');if(x){x.textContent='Ralat sambungan: '+(e.reason?.message||String(e.reason));x.style.display='block';}});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.getElementById('diagnostic').textContent='Pustaka Supabase tidak dapat dimuatkan. Semak sambungan internet atau sekatan CDN.';document.getElementById('diagnostic').style.display='block'"></script><script>
'use strict';
const URL='https://ledcwlnyztcsvdedwmtq.supabase.co';
const KEY='sb_publishable_a1sRyLibWsIpRThtxfUbUQ_-Ksjebvl';
const db=window.supabase?.createClient(URL,KEY,{auth:{detectSessionInUrl:false}});
const diag=document.getElementById('diagnostic');diag.textContent=db?'Sistem login sedia. Tekan Log Masuk untuk menguji.':'Pustaka Supabase tidak tersedia. Cuba rangkaian internet lain.';
const timed=(promise,ms=12000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Sambungan mengambil masa terlalu lama. Semak internet atau tetapan Supabase.')),ms))]);
const $=id=>document.getElementById(id);
let user=null,role=null,orders=[],filter='all',subscription=null,poll=null;
const statuses=['Baharu','Sedang Disediakan','Sedia Dihidangkan','Selesai','Dibatalkan'];
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=n=>'RM '+Number(n||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
function message(text,id='error'){ $(id).textContent=text;$(id).classList.toggle('hidden',!text); }
function showLogin(){user=null;role=null;document.body.classList.remove('admin-mode');$('adminFrame').removeAttribute('src');$('login').classList.remove('hidden');$('staff').classList.add('hidden');$('logout').style.display='none';clearInterval(poll);poll=null;if(subscription){db.removeChannel(subscription);subscription=null;}}
async function enter(u){
 const {data,error}=await timed(db.from('user_roles').select('role').eq('user_id',u.id).maybeSingle());
 if(error)throw error;
 const r=String(data?.role||'').toLowerCase();
 if(!['admin','staff','staf'].includes(r))throw Error('Akaun belum mempunyai peranan admin atau staff dalam user_roles.');
 user=u;role=r;$('login').classList.add('hidden');$('logout').style.display='block';
 if(r==='admin'){document.body.classList.add('admin-mode');$('staff').classList.add('hidden');$('adminFrame').src='admin.html';return;}
 document.body.classList.remove('admin-mode');$('staff').classList.remove('hidden');$('who').textContent=u.email||'Staf';await loadOrders();
 if(subscription)await db.removeChannel(subscription);
 subscription=db.channel('rkk-staff-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe();
 clearInterval(poll);poll=setInterval(loadOrders,15000);
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();diag.textContent='Butang berfungsi. Sedang cuba log masuk…';if(!db)return message('Supabase gagal dimuatkan. Semak internet.','loginError');const b=$('loginBtn');b.disabled=true;b.textContent='Sedang log masuk…';message('Sedang menghubungi Supabase…','loginError');try{const {data,error}=await timed(db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));if(error)throw error;diag.textContent='Login Supabase berjaya. Memeriksa peranan pengguna…';await enter(data.user);$('password').value='';}catch(err){diag.textContent='Login gagal: '+(err?.message||'Ralat tidak diketahui');message(err?.message||'Ralat tidak diketahui.','loginError');showLogin();message(err?.message||'Ralat tidak diketahui.','loginError');}finally{b.disabled=false;b.textContent='Log Masuk';}});
$('logout').onclick=async()=>{await db.auth.signOut();showLogin();};
async function loadOrders(){if(!user||role==='admin')return;const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(200);if(error){message('Gagal membaca pesanan: '+error.message);$('connection').textContent='Sambungan bermasalah';return;}message('');orders=data||[];$('connection').textContent='Disambungkan • '+new Date().toLocaleTimeString('ms-MY');render();}
function render(){const count=s=>orders.filter(o=>String(o.status||'').toLowerCase()===s.toLowerCase()).length;$('newCount').textContent=count('Baharu');$('prepCount').textContent=count('Sedang Disediakan');$('readyCount').textContent=count('Sedia Dihidangkan');const active=o=>!['selesai','dibatalkan'].includes(String(o.status||'').toLowerCase());const shown=orders.filter(o=>filter==='all'||(filter==='active'?active(o):!active(o)));$('orders').innerHTML=shown.length?shown.map(o=>{const date=o.created_at?new Date(o.created_at).toLocaleString('ms-MY'):'';return `<article class="order"><div class="order-head"><div><h3>Pesanan #${safe(o.order_number||String(o.id).slice(0,8))}</h3><div class="muted">${safe(date)}</div></div><span class="badge">${safe(o.status||'Baharu')}</span></div><p><b>Nama:</b> ${safe(o.customer_name||'-')}</p><p><b>Meja:</b> ${safe(o.table_number||'-')}</p><p><b>Jumlah:</b> ${cash(o.total_amount)}</p><label for="s-${safe(o.id)}">Status pesanan</label><select id="s-${safe(o.id)}" data-id="${safe(o.id)}">${statuses.map(s=>`<option value="${safe(s)}" ${s===(o.status||'Baharu')?'selected':''}>${safe(s)}</option>`).join('')}</select><button data-save="${safe(o.id)}">Simpan Status</button></article>`;}).join(''):'<div class="empty">Tiada pesanan untuk dipaparkan.</div>';
 $('orders').querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>saveStatus(btn.dataset.save));}
async function saveStatus(id){const item=orders.find(o=>String(o.id)===String(id));if(!item)return;const select=Array.from($('orders').querySelectorAll('select[data-id]')).find(s=>s.dataset.id===String(id));if(!select)return;const status=select.value;if(!statuses.includes(status))return;const btn=Array.from($('orders').querySelectorAll('[data-save]')).find(b=>b.dataset.save===String(id));btn.disabled=true;try{const {data,error}=await db.from('orders').update({status}).eq('id',id).select('id,status');if(error)throw error;if(!data?.length)throw Error('Kemas kini tidak dibenarkan. Semak polisi RLS Supabase.');await loadOrders();}catch(err){message('Gagal kemas kini status: '+err.message);btn.disabled=false;}}
$('filters').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('filters').querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render();});$('refresh').onclick=loadOrders;
(async()=>{if(!db){message('Supabase gagal dimuatkan.','loginError');return;}const {data}=await timed(db.auth.getUser(),8000).catch(()=>({data:null}));if(data?.user){try{await enter(data.user);}catch(err){await db.auth.signOut();showLogin();message(err.message,'loginError');}}})();
// Disable old service worker cache during troubleshooting.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(console.warn);}
</script></body></html>
